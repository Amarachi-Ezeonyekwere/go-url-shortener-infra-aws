name: Infra — Provision & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'          
      - 'README.md'      
      - 'docs/**'        
      - '.gitignore'     
  workflow_dispatch:
   inputs:
      action:
        description: 'Choose whether to Deploy or Destroy the infrastructure'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

env:
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Terraform Security Gate
  # Format and validate before anything touches AWS
  # ─────────────────────────────────────────────
  terraform-gate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

  # ─────────────────────────────────────────────
  # JOB 2: Terraform Plan & Apply
  # Only runs if the gate passes
  # ─────────────────────────────────────────────
  terraform:
    name: Terraform Provision
    runs-on: ubuntu-latest
    needs: terraform-gate

    permissions:
      id-token: write
      contents: read

    outputs:
      ec2_public_ip: ${{ steps.tf-output.outputs.ec2_public_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        # Checks if you selected "destroy" in the UI. If yes, it creates a destroy plan.
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi
        env:
          TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_ecr_repository_url: ${{ secrets.ECR_REPOSITORY_URL }}

      - name: Terraform Apply or Destroy
        # This executes whatever plan was generated in the previous step (Apply or Destroy)
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_ecr_repository_url: ${{ secrets.ECR_REPOSITORY_URL }}

      - name: Get EC2 public IP
        id: tf-output
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_public_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "Captured IP: $EC2_IP"

  # ─────────────────────────────────────────────
  # JOB 3: Deploy
  # SSH into EC2, pull latest image, restart container
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: terraform
    if: ${{ github.event.inputs.action != 'destroy' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/linux_key.pem
          chmod 600 /tmp/linux_key.pem

      - name: Wait for EC2 to be ready
        run: sleep 60

      - name: Deploy latest image
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -i /tmp/linux_key.pem \
            ubuntu@${{ needs.terraform.outputs.ec2_public_ip }} \
            'bash -s' << 'ENDSSH'
          set -e

          echo "Waiting for Docker to be ready..."
          for i in $(seq 1 30); do
            if sudo docker info > /dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Attempt $i/30 — waiting 10 seconds..."
            sleep 10
          done

          aws ecr get-login-password --region us-east-1 | \
            sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URL }}

          sudo docker pull ${{ secrets.ECR_REPOSITORY_URL }}:latest
          sudo docker stop url-shortener || true
          sudo docker rm -f url-shortener || true

          sudo docker run -d \
            --name url-shortener \
            --restart unless-stopped \
            -p 80:8080 \
            -e APP_HOST=http://${{ needs.terraform.outputs.ec2_public_ip }} \
            ${{ secrets.ECR_REPOSITORY_URL }}:latest

          sudo docker image prune -f
          echo "Deployment complete"
          exit 0
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/linux_key.pem

      - name: App is live
        run: |
          echo "✅ App live at: http://${{ needs.terraform.outputs.ec2_public_ip }}"