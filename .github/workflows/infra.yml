name: Infra — Provision & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Terraform Security Gate
  # Format and validate before anything touches AWS
  # ─────────────────────────────────────────────
  terraform-gate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

  # ─────────────────────────────────────────────
  # JOB 2: Terraform Plan & Apply
  # Only runs if the gate passes
  # ─────────────────────────────────────────────
  terraform:
    name: Terraform Provision
    runs-on: ubuntu-latest
    needs: terraform-gate

    permissions:
      id-token: write
      contents: read

    outputs:
      ec2_public_ip: ${{ steps.tf-output.outputs.ec2_public_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_ecr_repository_url: ${{ secrets.ECR_REPOSITORY_URL }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -replace="module.compute.aws_instance.app"
        env:
          TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_ecr_repository_url: ${{ secrets.ECR_REPOSITORY_URL }}

      - name: Get EC2 public IP
        id: tf-output
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_public_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "Captured IP: $EC2_IP"

  # ─────────────────────────────────────────────
  # JOB 3: Deploy
  # SSH into EC2, pull latest image, restart container
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: terraform

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/linux_key.pem
          chmod 600 /tmp/linux_key.pem

      - name: Wait for EC2 to be ready
        run: sleep 60

      - name: Deploy latest image
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i /tmp/linux_key.pem \
              ubuntu@${{ needs.terraform.outputs.ec2_public_ip }} << 'ENDSSH'
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URL }}
            docker pull ${{ secrets.ECR_REPOSITORY_URL }}:latest
            docker stop url-shortener || true
            docker rm url-shortener || true
            docker run -d \
              --name url-shortener \
              --restart unless-stopped \
              -p 80:8080 \
              ${{ secrets.ECR_REPOSITORY_URL }}:latest
            docker image prune -f
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/linux_key.pem

      - name: App is live
        run: |
          echo "✅ App live at: http://${{ needs.terraform.outputs.ec2_public_ip }}"